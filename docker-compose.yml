# ShopFloor on one computer, reachable from the LAN.
#   1. copy .env.example to .env and fill it in   2. docker compose up -d --build
#   3. first time only: docker compose run --rm api npm run db:seed
# See docs/DEPLOYMENT.md.
name: shopfloor

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopfloor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shopfloor
    volumes:
      - shopfloor-pgdata:/var/lib/postgresql/data
    # Not published to the network: only the API container can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopfloor -d shopfloor"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://shopfloor:${POSTGRES_PASSWORD}@db:5432/shopfloor
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
      SESSION_HOURS: ${SESSION_HOURS:-10}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env (the address people type in the browser)}
      TRUST_PROXY: "1"
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
    # Port 4000 is internal only; people reach the API through the web container.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  shopfloor-pgdata:
